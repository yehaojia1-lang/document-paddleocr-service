services:
  - type: web
    name: document-translation-web
    env: docker
    plan: free
    dockerfilePath: ./frontend-service/Dockerfile
    dockerContext: ./frontend-service
    envVars:
      - key: OCR_SERVICE_URL
        value: https://document-paddleocr-service.onrender.com
      - key: SUPABASE_URL
        value: https://hcariewwelyiahivevwj.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat

  - type: web
    name: document-paddleocr-service
    env: docker
    plan: free
    dockerfilePath: ./ocr-service/Dockerfile
    dockerContext: ./ocr-service
    healthCheckPath: /health
    envVars:
      - key: MAX_PDF_PAGES
        value: "10"
      - key: MAX_IMAGE_SIDE
        value: "1500"
      - key: MIN_IMAGE_SIDE
        value: "1200"
      - key: PDF_RENDER_SCALE
        value: "1.45"
      - key: OCR_PROVIDER
        value: ocrspace
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
