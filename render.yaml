services:
  - type: web
    name: document-translation-frontend
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: OCR_SERVICE_URL
        value: https://document-paddleocr-service.onrender.com

  - type: web
    name: document-paddleocr-service
    env: docker
    plan: free
    dockerfilePath: ./ocr-service/Dockerfile
    dockerContext: ./ocr-service
    healthCheckPath: /health
    envVars:
      - key: MAX_PDF_PAGES
        value: "8"
      - key: MAX_IMAGE_SIDE
        value: "1500"
