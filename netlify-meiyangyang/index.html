<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>给美羊羊的江南西小纸条</title>
    <meta name="description" content="给美羊羊选择下午茶后安排、晚餐和饮料的小互动网页。" />
    <style>
      :root {
        --foreground: #171317;
        --pink: #ef45bc;
        --pink-dark: #d5279f;
        --paper: #fffdfb;
        --muted: #6f6570;
        --matcha: #8aaa61;
        --line: #171317;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.86), transparent 9rem),
          radial-gradient(circle at 82% 20%, rgba(138, 170, 97, 0.34), transparent 12rem),
          radial-gradient(circle at 26% 82%, rgba(239, 69, 188, 0.22), transparent 13rem),
          linear-gradient(135deg, #ffe4f1 0%, #fff8ee 48%, #e9f5d8 100%);
        color: var(--foreground);
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .app-shell {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 20px;
      }

      .phone {
        position: relative;
        z-index: 2;
        width: min(100%, 430px);
        min-height: min(820px, calc(100vh - 40px));
        border: 5px solid rgba(23, 19, 23, 0.22);
        border-radius: 38px;
        background:
          linear-gradient(90deg, rgba(239, 69, 188, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(138, 170, 97, 0.08) 1px, transparent 1px),
          rgba(255, 253, 251, 0.72);
        background-size: 30px 30px;
        box-shadow: 0 32px 90px rgba(50, 34, 48, 0.2);
        padding: 58px 20px 24px;
      }

      .phone-top {
        position: absolute;
        top: 16px;
        left: 18px;
        right: 18px;
        display: grid;
        grid-template-columns: 14px 1fr 28px;
        align-items: center;
        gap: 10px;
        color: rgba(23, 19, 23, 0.54);
        font-size: 14px;
      }

      .close {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(23, 19, 23, 0.06);
        color: rgba(23, 19, 23, 0.58);
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--pink);
        box-shadow: 18px 0 #ffd05d, 36px 0 var(--matcha);
      }

      .card {
        min-height: 610px;
        display: none;
        flex-direction: column;
        justify-content: center;
        border: 3px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 253, 251, 0.92);
        padding: 28px 22px;
        text-align: center;
        box-shadow: 10px 10px 0 rgba(23, 19, 23, 0.16);
        animation: pop 260ms ease;
      }

      .card.active {
        display: flex;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .icon {
        width: 74px;
        height: 74px;
        margin: 0 auto 22px;
        border: 3px solid var(--line);
        border-radius: 20px;
        background: var(--pink);
        box-shadow: 7px 7px 0 rgba(23, 19, 23, 0.22);
      }

      .matcha {
        background:
          radial-gradient(circle at 50% 52%, #a3c47a 0 28%, #718f4d 29% 41%, #fffdfb 42% 58%, transparent 59%),
          var(--pink);
      }

      .spark {
        background:
          linear-gradient(45deg, transparent 38%, #fff7ae 39% 45%, transparent 46%),
          linear-gradient(-45deg, transparent 38%, #fff7ae 39% 45%, transparent 46%),
          var(--pink);
      }

      .flower-icon {
        background:
          radial-gradient(circle at 50% 24%, #fff7ae 0 15%, transparent 16%),
          radial-gradient(circle at 72% 48%, #fff7ae 0 15%, transparent 16%),
          radial-gradient(circle at 50% 72%, #fff7ae 0 15%, transparent 16%),
          radial-gradient(circle at 28% 48%, #fff7ae 0 15%, transparent 16%),
          radial-gradient(circle at 50% 50%, #fffdfb 0 14%, transparent 15%),
          var(--pink);
      }

      .dinner-icon,
      .drink-icon {
        background:
          radial-gradient(circle at 50% 48%, #fffdfb 0 27%, transparent 28%),
          linear-gradient(90deg, transparent 25%, #fff7ae 26% 32%, transparent 33% 66%, #fff7ae 67% 73%, transparent 74%),
          var(--pink);
      }

      .sheep {
        background:
          radial-gradient(circle at 32% 38%, #fffdfb 0 14%, transparent 15%),
          radial-gradient(circle at 68% 38%, #fffdfb 0 14%, transparent 15%),
          radial-gradient(circle at 50% 55%, #fffdfb 0 34%, transparent 35%),
          var(--pink);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--pink-dark);
        font-size: 14px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        color: var(--foreground);
        font-size: clamp(34px, 8vw, 48px);
        font-weight: 900;
        line-height: 1.08;
      }

      .card > p,
      .soft-line,
      .copy-text {
        margin: 18px auto 24px;
        max-width: 30rem;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.72;
      }

      .hot-button,
      .plain-button,
      .ghost-run,
      .plan,
      .drink {
        border: 3px solid var(--line);
        cursor: pointer;
        font-weight: 900;
      }

      .hot-button {
        min-width: 190px;
        min-height: 54px;
        margin: 0 auto;
        border-radius: 999px;
        background: var(--pink);
        color: #fff;
        box-shadow: 5px 7px 0 rgba(23, 19, 23, 0.8);
      }

      .wide {
        width: min(100%, 300px);
        margin-top: 18px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }

      .ghost-run,
      .plain-button {
        min-height: 54px;
        border-radius: 999px;
        background: #fffdfb;
        color: var(--foreground);
        padding: 0 22px;
        transition: transform 180ms ease;
      }

      .plan-list,
      .drink-grid {
        display: grid;
        gap: 10px;
        margin-top: 20px;
        text-align: left;
      }

      .drink-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 8px;
      }

      .plan,
      .drink {
        border-radius: 18px;
        background: #fffdfb;
        color: var(--foreground);
        box-shadow: 4px 5px 0 rgba(23, 19, 23, 0.2);
      }

      .plan {
        display: grid;
        gap: 6px;
        padding: 12px;
      }

      .plan strong {
        font-size: 17px;
      }

      .plan span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .drink {
        min-height: 56px;
        font-size: 18px;
      }

      .plan.active,
      .drink.active {
        background: #fff0fb;
        border-color: var(--pink-dark);
        box-shadow: 4px 5px 0 rgba(239, 69, 188, 0.42);
      }

      .ticket {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 4px 0 18px;
        text-align: left;
      }

      .ticket div {
        min-height: 86px;
        border: 3px solid var(--line);
        border-radius: 16px;
        background: #fffdfb;
        padding: 12px;
      }

      .ticket div:first-child {
        grid-column: 1 / -1;
      }

      .ticket span {
        display: block;
        color: var(--pink-dark);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .ticket strong {
        display: block;
        margin-top: 8px;
        font-size: 18px;
        line-height: 1.2;
      }

      .copy-text {
        margin-top: 0;
        border: 2px dashed rgba(23, 19, 23, 0.28);
        border-radius: 16px;
        background: rgba(255, 240, 251, 0.68);
        padding: 12px;
        font-size: 14px;
        text-align: left;
      }

      .floating-flower {
        position: absolute;
        z-index: 1;
        color: var(--pink);
        font-size: 24px;
        text-shadow: 2px 2px 0 #fff;
        animation: float 5s ease-in-out infinite;
      }

      .f1 { top: 9%; left: 18%; }
      .f2 { top: 19%; right: 21%; animation-delay: -1s; }
      .f3 { bottom: 16%; left: 17%; animation-delay: -2s; }
      .f4 { right: 14%; bottom: 12%; animation-delay: -3s; }
      .f5 { top: 49%; left: 8%; animation-delay: -4s; }

      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(14deg); }
      }

      @media (max-width: 460px) {
        .app-shell { padding: 0; }
        .phone {
          width: 100%;
          min-height: 100vh;
          border: 0;
          border-radius: 0;
          padding: 54px 14px 18px;
        }
        .card {
          min-height: calc(100vh - 82px);
          padding: 24px 16px;
        }
        .ticket { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <span class="floating-flower f1">✿</span>
      <span class="floating-flower f2">✿</span>
      <span class="floating-flower f3">✿</span>
      <span class="floating-flower f4">✿</span>
      <span class="floating-flower f5">✿</span>
      <section class="phone" aria-live="polite">
        <div class="phone-top">
          <span class="dot"></span>
          <span>To 美羊羊 ~</span>
          <button class="close" type="button" aria-label="关闭">x</button>
        </div>

        <div class="card active" data-scene="hello">
          <div class="icon matcha" aria-hidden="true"></div>
          <p class="eyebrow">给美羊羊的小纸条</p>
          <h1>美羊羊，帮我选一下</h1>
          <p>周日下午我们约了江南西抹茶和晚餐，但中间那段、还有晚餐吃什么，我想让你选一个舒服的版本。</p>
          <button class="hot-button" type="button" data-next="confirm">点开看看</button>
        </div>

        <div class="card" data-scene="confirm">
          <div class="icon spark" aria-hidden="true"></div>
          <p class="eyebrow">美羊羊先确认一下</p>
          <h1>这个不是表白程序</h1>
          <p>只是一个认真安排周日下午的小网页。不会突然给你压力，也不会把行程排得很满。</p>
          <div class="button-row">
            <button class="hot-button" type="button" data-next="afterTea">好啦好啦</button>
            <button class="ghost-run" type="button" id="shy">我有点警觉</button>
          </div>
        </div>

        <div class="card" data-scene="afterTea">
          <div class="icon flower-icon" aria-hidden="true"></div>
          <p class="eyebrow">问美羊羊</p>
          <h1>抹茶之后去干嘛？</h1>
          <div class="plan-list" id="afterTeaList"></div>
          <button class="hot-button wide" type="button" data-next="dinner">选好了</button>
        </div>

        <div class="card" data-scene="dinner">
          <div class="icon dinner-icon" aria-hidden="true"></div>
          <p class="eyebrow">再问美羊羊</p>
          <h1>晚上想吃什么？</h1>
          <div class="plan-list" id="dinnerList"></div>
          <button class="hot-button wide" type="button" data-next="drinks">下一步</button>
        </div>

        <div class="card" data-scene="drinks">
          <div class="icon drink-icon" aria-hidden="true"></div>
          <p class="eyebrow">可以多选</p>
          <h1>还想喝点什么？</h1>
          <p class="soft-line">抹茶是主线，这里只是备用饮料清单。美羊羊可以多选，也可以一个都不选。</p>
          <div class="drink-grid" id="drinkList"></div>
          <button class="hot-button wide" type="button" data-next="ticket">生成小票</button>
        </div>

        <div class="card" data-scene="ticket">
          <div class="icon sheep" aria-hidden="true"></div>
          <p class="eyebrow">美羊羊的约会小票</p>
          <h1>路线暂定成功</h1>
          <p class="soft-line">周日下午，江南西。先抹茶，再玩一会儿，吃完晚餐就回家。</p>
          <div class="ticket" id="ticket"></div>
          <p class="copy-text" id="copyText"></p>
          <div class="button-row">
            <button class="hot-button" type="button" id="copy">复制发给我</button>
            <button class="plain-button" type="button" data-next="afterTea">改一下</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const afterTeaPlans = [
        { id: "citywalk", title: "江南西随便逛逛", detail: "不赶行程，看到有意思的小店就进去看看，适合慢慢聊天。" },
        { id: "photo", title: "拍照 / 大头贴", detail: "找个好看的地方拍几张照，或者去拍大头贴，轻松一点。" },
        { id: "arcade", title: "电玩城抓娃娃", detail: "不用一直讲话也不会冷场，玩一会儿刚好等到饭点。" },
        { id: "movie", title: "看场轻松电影", detail: "如果天气热或者不想走路，就看有没有合适场次。" }
      ];
      const dinnerOptions = [
        { id: "cantonese", title: "粤菜 / 茶餐厅", detail: "稳一点，不太容易踩雷，也适合慢慢吃。" },
        { id: "japanese", title: "日料 / 寿司", detail: "清爽一点，下午吃了抹茶之后也不会太腻。" },
        { id: "bbq", title: "烤肉", detail: "气氛会热一点，但不会太正式，适合边吃边聊。" },
        { id: "hotpot", title: "火锅", detail: "如果我们都饿了，这个最有安全感。" },
        { id: "western", title: "意面 / 西餐", detail: "安静一点，比较适合吃完就舒服回家。" },
        { id: "youPick", title: "美羊羊来定", detail: "我负责查路线和排队情况，你负责选你想吃的。" }
      ];
      const drinkOptions = ["果茶", "咖啡", "奶茶", "气泡水", "冰淇淋", "你想喝的"];
      const state = { afterTeaId: "citywalk", dinnerId: "cantonese", drinks: ["果茶"], shyCount: 0 };

      function currentAfterTea() {
        return afterTeaPlans.find((item) => item.id === state.afterTeaId) || afterTeaPlans[0];
      }

      function currentDinner() {
        return dinnerOptions.find((item) => item.id === state.dinnerId) || dinnerOptions[0];
      }

      function message() {
        const afterTea = currentAfterTea();
        const dinner = currentDinner();
        const drinks = state.drinks.length ? state.drinks.join("、") : "到时候随缘";
        return `美羊羊，周日下午江南西抹茶之后，我们可以先「${afterTea.title}」：${afterTea.detail} 晚餐我想选「${dinner.title}」：${dinner.detail} 中间如果想喝点东西，可以选：${drinks}。吃完晚饭就送你回家/各自回家，不把行程排太满。你看这个节奏可以吗？`;
      }

      function show(scene) {
        document.querySelectorAll(".card").forEach((card) => card.classList.toggle("active", card.dataset.scene === scene));
        if (scene === "ticket") renderTicket();
      }

      function renderPlans() {
        const afterTeaList = document.getElementById("afterTeaList");
        afterTeaList.innerHTML = afterTeaPlans.map((item) =>
          `<button class="plan ${state.afterTeaId === item.id ? "active" : ""}" type="button" data-after="${item.id}">
            <strong>${item.title}</strong><span>${item.detail}</span>
          </button>`
        ).join("");

        const dinnerList = document.getElementById("dinnerList");
        dinnerList.innerHTML = dinnerOptions.map((item) =>
          `<button class="plan ${state.dinnerId === item.id ? "active" : ""}" type="button" data-dinner="${item.id}">
            <strong>${item.title}</strong><span>${item.detail}</span>
          </button>`
        ).join("");

        const drinkList = document.getElementById("drinkList");
        drinkList.innerHTML = drinkOptions.map((item) =>
          `<button class="drink ${state.drinks.includes(item) ? "active" : ""}" type="button" data-drink="${item}">${item}</button>`
        ).join("");
      }

      function renderTicket() {
        const afterTea = currentAfterTea();
        const dinner = currentDinner();
        const drinks = state.drinks.length ? state.drinks.join("、") : "随缘";
        document.getElementById("ticket").innerHTML = `
          <div><span>For</span><strong>美羊羊</strong></div>
          <div><span>Tea</span><strong>江南西抹茶</strong></div>
          <div><span>After Tea</span><strong>${afterTea.title}</strong></div>
          <div><span>Dinner</span><strong>${dinner.title}</strong></div>
          <div><span>Drinks</span><strong>${drinks}</strong></div>
          <div><span>Ending</span><strong>晚餐后回家</strong></div>
        `;
        document.getElementById("copyText").textContent = message();
      }

      document.addEventListener("click", async (event) => {
        const next = event.target.closest("[data-next]");
        if (next) show(next.dataset.next);

        const after = event.target.closest("[data-after]");
        if (after) {
          state.afterTeaId = after.dataset.after;
          renderPlans();
        }

        const dinner = event.target.closest("[data-dinner]");
        if (dinner) {
          state.dinnerId = dinner.dataset.dinner;
          renderPlans();
        }

        const drink = event.target.closest("[data-drink]");
        if (drink) {
          const value = drink.dataset.drink;
          state.drinks = state.drinks.includes(value) ? state.drinks.filter((item) => item !== value) : [...state.drinks, value];
          renderPlans();
        }

        if (event.target.id === "copy") {
          await navigator.clipboard.writeText(message());
          event.target.textContent = "已复制";
        }

        if (event.target.id === "shy") {
          state.shyCount += 1;
          event.target.style.transform = `translate(${state.shyCount * 10}px, ${state.shyCount % 2 ? -8 : 8}px)`;
        }
      });

      renderPlans();
    </script>
  </body>
</html>
