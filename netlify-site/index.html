<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>证件 OCR 测试版</title>
  <style>
    :root {
      --bg: #f6f7f3;
      --panel: #fff;
      --ink: #17201b;
      --muted: #61706a;
      --line: #d7dfd9;
      --accent: #176a4a;
      --gold: #d79f38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f6f7f3, #edf4ef 58%, #f8f0df);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 18px;
    }
    header, section {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 18px 54px rgba(23,32,27,.08);
    }
    header { padding: 22px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 56px); line-height: 1; }
    p { color: var(--muted); line-height: 1.65; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    section { padding: 16px; }
    .drop {
      display: grid;
      place-items: center;
      min-height: 280px;
      border: 2px dashed #aab9b0;
      border-radius: 10px;
      background: #fbfcfa;
      color: var(--accent);
      font-weight: 800;
      text-align: center;
      overflow: hidden;
    }
    .drop.dragging { border-color: var(--accent); box-shadow: inset 0 0 0 4px rgba(23,106,74,.14); }
    .drop img { max-width: 100%; max-height: 420px; object-fit: contain; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    button, select, input::file-selector-button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-weight: 800;
    }
    .secondary { background: #eef3ec; color: var(--accent); border: 1px solid var(--line); }
    select {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    input[type=file] { width: 100%; margin: 12px 0; }
    textarea {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: 15px/1.55 Consolas, "Microsoft YaHei", monospace;
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin: 10px 0;
    }
    .bar { height: 8px; border-radius: 999px; background: #e2e9e4; overflow: hidden; }
    .bar span { display: block; width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .2s; }
    .paste {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      color: var(--muted);
      outline: none;
      margin-top: 10px;
    }
    .hint { font-size: 13px; color: var(--muted); }
    canvas { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; background: #fff; }
    @media (max-width: 800px) {
      main { padding: 10px; }
      .grid { grid-template-columns: 1fr; }
      .drop { min-height: 220px; }
      textarea { min-height: 300px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>证件 OCR 测试版</h1>
    <p>请尽量上传“原始证件图片”，不要上传网页截图里的小证件。这个版本默认走云端 OCR：手机只负责上传图片，不再加载大型 wasm 和中文语言包。</p>
  </header>
  <div class="grid">
    <section>
      <h2>上传 / 拖拽 / 粘贴</h2>
      <label>
        识别模式
        <select id="mode">
          <option value="id">中国身份证字段识别</option>
          <option value="full">整图完整识别</option>
        </select>
      </label>
      <input id="file" type="file" accept="image/*" />
      <div id="drop" class="drop">把图片拖到这里，或选择文件</div>
      <div id="paste" class="paste" contenteditable="true">手机可选择文件上传；电脑可点这里后 Ctrl+V 粘贴截图</div>
      <div class="buttons">
        <button id="run" type="button">开始 OCR</button>
        <button id="copy" class="secondary" type="button">复制识别文本</button>
      </div>
    <p class="hint">提示：如果证件只占照片很小一块，识别会变差。请尽量裁到证件占画面 70% 以上。下方预处理图会显示实际送去 OCR 的图片。</p>
      <canvas id="debug"></canvas>
    </section>
    <section>
      <h2>识别结果</h2>
      <div class="status"><span id="status">等待图片</span><strong id="percent">0%</strong></div>
      <div class="bar"><span id="bar"></span></div>
      <textarea id="text" placeholder="OCR 文字会出现在这里，可手动校对后再复制到翻译工具。"></textarea>
    </section>
  </div>
</main>
<script>
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");
  const paste = document.getElementById("paste");
  const run = document.getElementById("run");
  const copy = document.getElementById("copy");
  const textArea = document.getElementById("text");
  const statusEl = document.getElementById("status");
  const percentEl = document.getElementById("percent");
  const bar = document.getElementById("bar");
  const debug = document.getElementById("debug");
  const mode = document.getElementById("mode");
  let currentFile = null;
  let currentBitmap = null;

  function setStatus(text, progress) {
    statusEl.textContent = text;
    if (typeof progress === "number") {
      const value = Math.max(0, Math.min(100, Math.round(progress * 100)));
      percentEl.textContent = value + "%";
      bar.style.width = value + "%";
    }
  }

  async function setFile(file) {
    if (!file) return;
    currentFile = file;
    currentBitmap = await createImageBitmap(file);
    drop.innerHTML = "";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.alt = "上传图片预览";
    drop.appendChild(img);
    setStatus("图片已载入，可开始 OCR", 0);
  }

  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  drop.addEventListener("dragover", event => { event.preventDefault(); drop.classList.add("dragging"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("dragging"));
  drop.addEventListener("drop", event => {
    event.preventDefault();
    drop.classList.remove("dragging");
    setFile(event.dataTransfer.files[0]);
  });
  paste.addEventListener("paste", event => {
    const file = Array.from(event.clipboardData.files).find(item => item.type.startsWith("image/"));
    if (file) {
      event.preventDefault();
      paste.textContent = "已粘贴截图";
      setFile(file);
    }
  });
  copy.addEventListener("click", async () => navigator.clipboard.writeText(textArea.value));
  run.addEventListener("click", recognize);

  async function recognize() {
    if (!currentBitmap) {
      setStatus("请先上传图片", 0);
      return;
    }
    textArea.value = "";
    try {
      if (mode.value === "id") {
        textArea.value = await recognizeIdCard(currentBitmap);
      } else {
        const canvas = preprocess(currentBitmap, detectDocumentRegion(currentBitmap));
        drawDebug(canvas);
        textArea.value = await cloudOcr(canvas, "6");
      }
      setStatus("识别完成", 1);
    } catch (error) {
      setStatus(error.message || "云端 OCR 失败", 0);
    }
  }

  async function recognizeIdCard(bitmap) {
    const cardCanvas = preprocess(bitmap, detectDocumentRegion(bitmap));
    drawDebug(cardCanvas);
    const cardBitmap = await createImageBitmap(cardCanvas);
    const regions = [
      { label: "姓名", x: .12, y: .14, w: .34, h: .10, psm: "7" },
      { label: "性别/民族", x: .12, y: .27, w: .42, h: .10, psm: "7" },
      { label: "出生", x: .12, y: .39, w: .50, h: .10, psm: "7" },
      { label: "住址", x: .12, y: .50, w: .58, h: .23, psm: "6" },
      { label: "公民身份号码", x: .25, y: .80, w: .62, h: .12, psm: "7" }
    ];
    const lines = ["中华人民共和国居民身份证"];
    for (let i = 0; i < regions.length; i++) {
      const r = regions[i];
      setStatus("正在识别 " + r.label, .12 + i * .16);
      const crop = preprocess(cardBitmap, r, 6);
      const value = normalizeField(r.label, await cloudOcr(crop, r.psm));
      if (value) lines.push(r.label === "性别/民族" ? value : `${r.label}：${value}`);
    }
    return lines.join("\n");
  }

  async function cloudOcr(canvas, psm) {
    setStatus("正在上传预处理图片到云端 OCR", .1);
    const image = canvasToDataUrl(canvas);
    const response = await fetch("/.netlify/functions/ocr", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image, psm })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || "云端 OCR 失败");
    return cleanup(result.text || "");
  }

  function canvasToDataUrl(canvas) {
    const maxSide = 2200;
    if (Math.max(canvas.width, canvas.height) <= maxSide) return canvas.toDataURL("image/jpeg", .88);
    const scale = maxSide / Math.max(canvas.width, canvas.height);
    const smaller = document.createElement("canvas");
    smaller.width = Math.round(canvas.width * scale);
    smaller.height = Math.round(canvas.height * scale);
    smaller.getContext("2d").drawImage(canvas, 0, 0, smaller.width, smaller.height);
    return smaller.toDataURL("image/jpeg", .88);
  }

  function preprocess(bitmap, region, forcedScale) {
    const sw = Math.round(bitmap.width * region.w);
    const sh = Math.round(bitmap.height * region.h);
    const scale = forcedScale || Math.min(7, Math.max(3, 2600 / Math.max(1, sw)));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(sw * scale);
    canvas.height = Math.round(sh * scale);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bitmap, Math.round(bitmap.width * region.x), Math.round(bitmap.height * region.y), sw, sh, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < img.data.length; i += 4) {
      const gray = img.data[i] * .3 + img.data[i + 1] * .59 + img.data[i + 2] * .11;
      const v = gray > 184 ? 255 : Math.max(0, gray - 45);
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v;
    }
    ctx.putImageData(img, 0, 0);
    return canvas;
  }

  function detectDocumentRegion(bitmap) {
    const w = 720;
    const scale = Math.min(1, w / bitmap.width);
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0, count = 0;
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const i = (y * canvas.width + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if ((b > 115 && g > 90 && b > r + 14) || (r > 180 && g > 180 && b > 170)) {
          minX = Math.min(minX, x); minY = Math.min(minY, y);
          maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
          count++;
        }
      }
    }
    if (count < 120 || maxX <= minX || maxY <= minY) return { x: 0, y: 0, w: 1, h: 1 };
    const padX = Math.round((maxX - minX) * .18);
    const padY = Math.round((maxY - minY) * .22);
    const left = Math.max(0, minX - padX), top = Math.max(0, minY - padY);
    const right = Math.min(canvas.width, maxX + padX), bottom = Math.min(canvas.height, maxY + padY);
    return { x: left / canvas.width, y: top / canvas.height, w: (right - left) / canvas.width, h: (bottom - top) / canvas.height };
  }

  function normalizeField(label, text) {
    const compact = text.replace(/\s+/g, "");
    if (!compact) return "";
    if (label === "性别/民族") {
      const sex = compact.includes("女") ? "女" : compact.includes("男") ? "男" : "待确认";
      const ethnicity = compact.includes("汉") ? "汉" : "待确认";
      return `性别：${sex}\n民族：${ethnicity}`;
    }
    if (label === "出生") {
      const m = compact.match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
      return m ? `${m[1]}年${Number(m[2])}月${Number(m[3])}日` : text;
    }
    if (label === "公民身份号码") {
      return compact.match(/\d{15,18}[\dXx]?/)?.[0] || text;
    }
    return text;
  }

  function cleanup(text) {
    return text.replace(/[|]+/g, " ").split(/\r?\n/).map(line => line.trim()).filter(Boolean).join("\n");
  }
  function drawDebug(canvas) {
    debug.width = canvas.width;
    debug.height = canvas.height;
    debug.getContext("2d").drawImage(canvas, 0, 0);
  }
</script>
</body>
</html>
