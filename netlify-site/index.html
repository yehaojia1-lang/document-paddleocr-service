<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>证件 OCR 测试版</title>
  <style>
    :root {
      --bg: #f6f7f3;
      --panel: #fff;
      --ink: #17201b;
      --muted: #61706a;
      --line: #d7dfd9;
      --accent: #176a4a;
      --gold: #d79f38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #f6f7f3, #edf4ef 58%, #f8f0df);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 18px; }
    header, section {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 18px 54px rgba(23,32,27,.08);
    }
    header { padding: 22px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 56px); line-height: 1; }
    p { color: var(--muted); line-height: 1.65; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    section { padding: 16px; }
    label { display: grid; gap: 8px; color: var(--muted); font-weight: 700; }
    .drop {
      display: grid;
      place-items: center;
      min-height: 280px;
      border: 2px dashed #aab9b0;
      border-radius: 10px;
      background: #fbfcfa;
      color: var(--accent);
      font-weight: 800;
      text-align: center;
      overflow: hidden;
    }
    .drop.dragging { border-color: var(--accent); box-shadow: inset 0 0 0 4px rgba(23,106,74,.14); }
    .drop img { max-width: 100%; max-height: 460px; object-fit: contain; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    button, select, input::file-selector-button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-weight: 800;
    }
    .secondary { background: #eef3ec; color: var(--accent); border: 1px solid var(--line); }
    button:disabled { opacity: .55; }
    select {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      width: min(100%, 360px);
    }
    input[type=file] { width: 100%; margin: 12px 0; }
    textarea {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: 15px/1.55 Consolas, "Microsoft YaHei", monospace;
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin: 10px 0;
    }
    .bar { height: 8px; border-radius: 999px; background: #e2e9e4; overflow: hidden; }
    .bar span { display: block; width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .2s; }
    .paste {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      color: var(--muted);
      outline: none;
      margin-top: 10px;
    }
    .hint { font-size: 13px; color: var(--muted); }
    canvas { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; background: #fff; }
    @media (max-width: 800px) {
      main { padding: 10px; }
      .grid { grid-template-columns: 1fr; }
      .drop { min-height: 220px; }
      textarea { min-height: 300px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>证件 OCR 测试版</h1>
    <p>请上传原始证件图片，手机也可以直接选择文件。这个版本不在手机端裁切字段，而是把图片交给云端自动尝试不同方向和增强方案，减少空白、乱码和横竖方向识别失败。</p>
  </header>
  <div class="grid">
    <section>
      <h2>上传 / 拖拽 / 粘贴</h2>
      <label>
        识别模式
        <select id="mode">
          <option value="full">整图完整识别（推荐）</option>
          <option value="id">中国身份证优先识别</option>
        </select>
      </label>
      <input id="file" type="file" accept="image/*" />
      <div id="drop" class="drop">把图片拖到这里，或选择文件</div>
      <div id="paste" class="paste" contenteditable="true">手机可选择文件上传；电脑可点击这里后 Ctrl+V 粘贴截图</div>
      <div class="buttons">
        <button id="run" type="button">开始 OCR</button>
        <button id="copy" class="secondary" type="button">复制识别文本</button>
      </div>
      <p class="hint">提示：如果证件只占照片很小一块，识别会变差。请尽量裁到证件占画面 70% 以上；如果身份证是横着拍的，现在会自动尝试旋转识别。</p>
      <canvas id="debug"></canvas>
    </section>
    <section>
      <h2>识别结果</h2>
      <div class="status"><span id="status">等待图片</span><strong id="percent">0%</strong></div>
      <div class="bar"><span id="bar"></span></div>
      <textarea id="text" placeholder="OCR 文字会出现在这里，可手动校对后再复制到翻译工具。"></textarea>
    </section>
  </div>
</main>
<script>
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");
  const paste = document.getElementById("paste");
  const run = document.getElementById("run");
  const copy = document.getElementById("copy");
  const textArea = document.getElementById("text");
  const statusEl = document.getElementById("status");
  const percentEl = document.getElementById("percent");
  const bar = document.getElementById("bar");
  const debug = document.getElementById("debug");
  const mode = document.getElementById("mode");

  let currentFile = null;
  let currentImage = null;
  let currentObjectUrl = "";
  let currentDataUrl = "";

  function setStatus(text, progress) {
    statusEl.textContent = text;
    if (typeof progress === "number") {
      const value = Math.max(0, Math.min(100, Math.round(progress * 100)));
      percentEl.textContent = value + "%";
      bar.style.width = value + "%";
    }
  }

  async function setFile(file) {
    if (!file) return;
    currentFile = file;
    currentDataUrl = await fileToDataUrl(file);
    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);
    currentImage = await loadImage(currentObjectUrl);

    drop.innerHTML = "";
    const img = document.createElement("img");
    img.src = currentObjectUrl;
    img.alt = "上传图片预览";
    drop.appendChild(img);

    drawPreview(currentImage);
    setStatus(`图片已载入 ${currentImage.naturalWidth}×${currentImage.naturalHeight}，可开始 OCR`, 0);
  }

  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  drop.addEventListener("dragover", event => { event.preventDefault(); drop.classList.add("dragging"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("dragging"));
  drop.addEventListener("drop", event => {
    event.preventDefault();
    drop.classList.remove("dragging");
    setFile(event.dataTransfer.files[0]);
  });
  paste.addEventListener("paste", event => {
    const file = Array.from(event.clipboardData.files).find(item => item.type.startsWith("image/"));
    if (file) {
      event.preventDefault();
      paste.textContent = "已粘贴截图";
      setFile(file);
    }
  });
  copy.addEventListener("click", async () => navigator.clipboard.writeText(textArea.value));
  run.addEventListener("click", recognize);

  async function recognize() {
    if (!currentImage || !currentFile) {
      setStatus("请先上传图片", 0);
      return;
    }

    run.disabled = true;
    textArea.value = "";
    try {
      setStatus("正在准备图片", .08);
      const images = await imageToUploadVariants(currentImage, currentDataUrl);
      setStatus("正在上传到云端 OCR，多方向识别中", .22);
      const result = await cloudOcrDataUrl(images, mode.value);
      const text = cleanup(result.text || "");
      textArea.value = text || result.warning || "没有识别到文字，请换更清晰、证件占比更大的原图再试。";
      const detail = result.rotation !== undefined
        ? `识别完成：方向 ${result.rotation}°，方案 ${result.variant || "-"}，评分 ${Math.round(result.score || 0)}`
        : "识别完成";
      setStatus(detail, 1);
    } catch (error) {
      textArea.value = "";
      setStatus(error.message || "云端 OCR 失败，请重新上传原图再试", 0);
    } finally {
      run.disabled = false;
    }
  }

  async function cloudOcrDataUrl(images, selectedMode) {
    const response = await fetch("/.netlify/functions/ocr", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ images, mode: selectedMode })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || "云端 OCR 失败");
    return result;
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("图片解码失败，请换 JPG/PNG 原图"));
      img.src = url;
    });
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("读取图片失败"));
      reader.readAsDataURL(file);
    });
  }

  async function imageToUploadVariants(image, fallbackDataUrl) {
    const rotations = [0, 90, 270, 180];
    const variants = [];
    for (const rotation of rotations) {
      try {
        variants.push({ rotation, image: imageToRotatedDataUrl(image, rotation) });
      } catch {
        if (rotation === 0 && fallbackDataUrl) variants.push({ rotation: 0, image: fallbackDataUrl });
      }
    }
    return variants.length ? variants : [{ rotation: 0, image: fallbackDataUrl }];
  }

  function imageToRotatedDataUrl(image, rotation) {
    const maxSide = 1700;
    const width = image.naturalWidth || image.width;
    const height = image.naturalHeight || image.height;
    if (!width || !height) throw new Error("图片尺寸为空");

    const scale = Math.min(1, maxSide / Math.max(width, height));
    const scaledWidth = Math.max(1, Math.round(width * scale));
    const scaledHeight = Math.max(1, Math.round(height * scale));
    const sideways = rotation === 90 || rotation === 270;
    const canvas = document.createElement("canvas");
    canvas.width = sideways ? scaledHeight : scaledWidth;
    canvas.height = sideways ? scaledWidth : scaledHeight;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(rotation * Math.PI / 180);
    ctx.drawImage(image, -scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);
    if (rotation === 0) drawDebug(canvas);
    return canvas.toDataURL("image/jpeg", .86);
  }

  function drawPreview(image) {
    const width = image.naturalWidth || image.width;
    const height = image.naturalHeight || image.height;
    const maxSide = 900;
    const scale = Math.min(1, maxSide / Math.max(width, height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    drawDebug(canvas);
  }

  function drawDebug(canvas) {
    debug.width = canvas.width;
    debug.height = canvas.height;
    debug.getContext("2d").drawImage(canvas, 0, 0);
  }

  function cleanup(text) {
    return String(text || "")
      .replace(/[|]+/g, " ")
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean)
      .join("\n");
  }
</script>
</body>
</html>
